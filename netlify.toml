[build]
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express", "mongoose"]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 30

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
